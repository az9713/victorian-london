<!doctype html>
<!--
  Stage 1+ sandbox — victorian-london (1880s Whitechapel/Spitalfields)
  Layout records live in ./layout.js (single source for game, colliders, and
  asset assembly). Figures from refpack/README.md. Never scale off a plate.
  Coordinates: x = west->east [0,350], z = north->south [0,300], y up. Datum +0.00 = ground.
  Sim runs on rAF: THE TAB MUST BE VISIBLE while a gate holds keys (documented choice).
  Telemetry: window.__game (READ-ONLY state), window.__probe (raw key event log).
  No teleport API exists — the route must be walked.
-->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Victorian London — Sandbox</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0f172a;font:14px/1.4 system-ui,sans-serif}
  #hud{position:fixed;top:10px;left:10px;color:#e2e8f0;background:rgba(15,23,42,.72);
       padding:10px 14px;border-radius:8px;pointer-events:none;white-space:pre}
  #hint{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);color:#94a3b8;
        background:rgba(15,23,42,.72);padding:6px 12px;border-radius:8px;pointer-events:none}
  #done{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);color:#2dd4bf;
        font-size:28px;font-weight:700;display:none;pointer-events:none;
        background:rgba(15,23,42,.85);padding:18px 28px;border-radius:12px}
</style>
</head>
<body>
<div id="hud"></div>
<div id="hint">WASD move · Shift sprint · drag / arrow keys camera · click for mouse-look</div>
<div id="done">ROUTE COMPLETE</div>
<div id="prompt" style="position:fixed;bottom:56px;left:50%;transform:translateX(-50%);
  color:#fbbf24;background:rgba(15,23,42,.8);padding:6px 14px;border-radius:8px;
  pointer-events:none;display:none;font-weight:600"></div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { buildLayout } from './layout.js';
import { upgradeWorld } from './assets.js';

const L = buildLayout();

// ---------- scene ----------
const scene = new THREE.Scene();
// stage 4 atmosphere, graded against refpack/tier2/hero.jpg: green-grey coal smog,
// strong aerial perspective (distant terraces dissolve), soft overcast key
scene.background = new THREE.Color(0xb4baa8);
scene.fog = new THREE.Fog(0xb4baa8, 35, 290);
const gameplayCamera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 600);
gameplayCamera.name = 'gameplay';
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);
addEventListener('resize', ()=>{ gameplayCamera.aspect=innerWidth/innerHeight;
  gameplayCamera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

scene.add(new THREE.HemisphereLight(0xc9ccba, 0x4c4a42, 1.15));
const sun = new THREE.DirectionalLight(0xfff0d8, 0.75); sun.position.set(120,180,80); scene.add(sun);

// ---------- greybox from layout records: every record = mesh + (optional) collider ----------
const colliders = [];                                   // {x1,z1,x2,z2}
const mat = c => new THREE.MeshLambertMaterial({color:c});
const CLAY=0x9aa0a6, CLAY2=0x8a9096, LANDMARK=0xb0a893, IRON=0x6b7280, DARK=0x4b5563;
const KIND_COLOR = {
  'viaduct-pier':IRON, 'viaduct-deck':IRON, 'market-wall':LANDMARK, 'market-column':CLAY2,
  'church-nave':LANDMARK, 'church-tower':LANDMARK, 'ginpalace':0xa89a7e,
  'ginpalace-front':0xd8c98a, 'rookery':CLAY2, 'rookery-wall':CLAY2, 'gy-flank':CLAY,
  'terrace0':CLAY, 'terrace1':CLAY2, 'terrace2':0x93999f,
};
const kindMeshes = {};
const track = (kind, m) => { (kindMeshes[kind] ??= []).push(m); return m; };
for (const b of L.boxes){
  if (b.kind !== 'bounds'){
    const m = new THREE.Mesh(new THREE.BoxGeometry(b.x2-b.x1, b.y1-b.y0, b.z2-b.z1),
                             mat(KIND_COLOR[b.kind] ?? CLAY));
    m.position.set((b.x1+b.x2)/2,(b.y0+b.y1)/2,(b.z1+b.z2)/2);
    scene.add(track(b.kind, m));
  }
  if (b.collide && b.y0 < 1.6 && b.y1 > 0.3)
    colliders.push({x1:b.x1,z1:b.z1,x2:b.x2,z2:b.z2});
}

// ground: 350 x 300, LEVEL by ruling
const ground = new THREE.Mesh(new THREE.PlaneGeometry(L.bounds.x, L.bounds.z), mat(0x7d8288));
ground.rotation.x = -Math.PI/2; ground.position.set(L.bounds.x/2, 0, L.bounds.z/2);
scene.add(track('ground', ground));

// market gable roof to ridge +14 (derived from the market record)
{
  const MB = L.market;
  for (const s of [-1,1]){
    const w=(MB.z2-MB.z1)/2, len=Math.hypot(w,5);
    const r=new THREE.Mesh(new THREE.BoxGeometry(MB.x2-MB.x1,0.3,len), mat(0xaab4bd));
    r.position.set((MB.x1+MB.x2)/2, 11.5, 150 + s*w/2); r.rotation.x = -s*Math.atan2(5,w);
    scene.add(track('market-roof', r));
  }
}

// church spire (pyramid, apex +50)
{
  const S = L.spire;
  const spire=new THREE.Mesh(new THREE.ConeGeometry(S.halfBase, S.topY-S.baseY, 4), mat(LANDMARK));
  spire.position.set(S.x,(S.baseY+S.topY)/2,S.z); spire.rotation.y=Math.PI/4;
  scene.add(track('church-spire', spire));
}

// L7 pillar box
{
  const P = L.pillarbox;
  const pb=new THREE.Mesh(new THREE.CylinderGeometry(P.r,P.r,P.h,12), mat(0x7a3030));
  pb.position.set(P.x,P.h/2,P.z); scene.add(track('pillarbox', pb));
  colliders.push({x1:P.x-P.r,z1:P.z-P.r,x2:P.x+P.r,z2:P.z+P.r});
}

// gas lamps (height 2.40)
for (const g of L.lamps){
  const p=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,2.4,8), mat(DARK));
  p.position.set(g.x,1.2,g.z); scene.add(track('lamp', p));
  const h=new THREE.Mesh(new THREE.BoxGeometry(.28,.34,.28), mat(0xd8c98a));
  h.position.set(g.x,2.45,g.z); scene.add(track('lamp', h));
}

// progressive asset upgrade (no-op until builder GLBs land in assets/models/)
let worldReport = null;
upgradeWorld({ THREE, GLTFLoader, scene, L, kindMeshes })
  .then(r => worldReport = r).catch(e => console.error('upgradeWorld failed:', e));

// ---------- fault injection (gate red-tests ONLY; no fault param = normal game) ----------
const FAULT = new URLSearchParams(location.search).get('fault');
if (FAULT==='seal') colliders.push({x1:284,z1:60,x2:296,z2:62});   // seals Brick Lane
const debugCamera = gameplayCamera.clone(); debugCamera.name='debug';
debugCamera.position.set(175,290,150); debugCamera.lookAt(175,0,150);   // whole 350x300 slice
if (FAULT==='cam') scene.fog = null;    // aerial evidence view; fog washes out 290 m

// ---------- player: capsule collider + rigged costermonger visual (stage 2b) ----------
const player = new THREE.Group();
const capsule = new THREE.Mesh(new THREE.CapsuleGeometry(0.35,1.05,4,10), mat(0x2dd4bf));
capsule.position.y = 0.875; player.add(capsule);
player.position.set(L.spawn.x, 0, L.spawn.z);
scene.add(player);
const P = {r:0.35, walk:4.0, sprint:8.0, yaw:L.spawn.yaw, pitch:-0.25};

const gltfLoader = new GLTFLoader();
const loadGlb = u => new Promise((res, rej) => gltfLoader.load(u, res, undefined, rej));
// scale a loaded character to a real height with feet at y=0
function fitCharacter(model, height){
  const bb = new THREE.Box3().setFromObject(model);
  model.scale.setScalar(height / (bb.max.y - bb.min.y));
  bb.setFromObject(model);
  model.position.y = -bb.min.y;
}

// character: idle.glb is the base (skin + Idle clip); walk/run clips retarget onto it
const char = { model:null, mixer:null, actions:{}, active:null, bones:0, footBone:null, heading:0 };
{
  const load = loadGlb;
  Promise.all(['assets/character/idle.glb','assets/character/walk.glb','assets/character/run.glb'].map(load))
    .then(([idle, walk, run]) => {
      const model = idle.scene;
      fitCharacter(model, 1.75);          // Meshy pivot is not at the feet
      player.add(model);
      capsule.visible = false;
      char.model = model;
      char.mixer = new THREE.AnimationMixer(model);
      for (const [name, g] of [['idle', idle], ['walk', walk], ['run', run]]){
        const clip = g.animations[0];
        if (clip) { char.actions[name] = char.mixer.clipAction(clip); }
      }
      char.actions.idle?.play(); char.active = 'idle';
      // rig read-back through the ACTUAL loader (name-mangling check) + a probe bone
      model.traverse(o => { if (o.isBone){ char.bones++;
        if (!char.footBone && /foot|Foot/.test(o.name)) char.footBone = o; }});
      console.log('rig bones:', char.bones, 'foot bone:', char.footBone?.name);
    })
    .catch(e => console.error('character load failed, capsule stays:', e));
}
function setAnim(name){
  if (char.active === name || !char.actions[name]) return;
  const from = char.actions[char.active], to = char.actions[name];
  to.reset().play();
  if (from) from.crossFadeTo(to, 0.2, false);
  char.active = name;
}

// ---------- ambient NPCs: flower girl works the plaza, the constable walks his beat ----------
const npcs = [];
function spawnNPC(name, height, path, speed){
  Promise.all([loadGlb(`assets/character/${name}-idle.glb`), loadGlb(`assets/character/${name}-walk.glb`)])
    .then(([idle, walk]) => {
      const model = idle.scene;
      fitCharacter(model, height);
      const grp = new THREE.Group(); grp.add(model);
      grp.position.set(path[0][0], 0, path[0][1]);
      scene.add(grp);
      const mixer = new THREE.AnimationMixer(model);
      const act = { idle: mixer.clipAction(idle.animations[0]), walk: mixer.clipAction(walk.animations[0]) };
      act.walk.play();
      npcs.push({ grp, model, mixer, act, path, i:1, speed, state:'walk', wait:0, heading:0 });
    })
    .catch(e => console.error('npc load failed:', name, e));
}
spawnNPC('flowergirl', 1.65,
  [[210,150],[240,146],[262,150],[252,134],[214,140]], 1.1);
spawnNPC('constable', 1.80,
  [[60,60],[60,140],[65,150],[60,225],[57,280],[60,225],[65,150],[60,140]], 1.4);
function npcTick(dt){
  for (const n of npcs){
    n.mixer.update(dt);
    if (n.state === 'idle'){
      n.wait -= dt;
      if (n.wait <= 0){ n.state='walk'; n.act.idle.crossFadeTo(n.act.walk.reset().play(), 0.3, false); }
      continue;
    }
    const [tx, tz] = n.path[n.i];
    const dx = tx - n.grp.position.x, dz = tz - n.grp.position.z;
    const d = Math.hypot(dx, dz);
    if (d < 0.4){
      n.i = (n.i + 1) % n.path.length;
      n.state='idle'; n.wait = 2 + Math.random() * 4;
      n.act.walk.crossFadeTo(n.act.idle.reset().play(), 0.3, false);
      continue;
    }
    const target = Math.atan2(dx, dz);
    let dh = target - n.heading;
    while (dh > Math.PI) dh -= 2*Math.PI; while (dh < -Math.PI) dh += 2*Math.PI;
    n.heading += dh * Math.min(1, 6*dt);
    n.model.rotation.y = n.heading;
    n.grp.position.x += dx/d * n.speed * dt;
    n.grp.position.z += dz/d * n.speed * dt;
  }
}

// ---------- input: held-key STATE (no auto-repeat), raw probe log ----------
const keys = {};
window.__probe = {downs:0, ups:0, last:null};              // liveness probe: sees EVERY key
if (FAULT!=='deadkeys'){
addEventListener('keydown', e=>{ if(e.repeat) return; keys[e.code]=true;
  __probe.downs++; __probe.last=['down',e.code,performance.now()]; });
addEventListener('keyup', e=>{ keys[e.code]=false;
  __probe.ups++; __probe.last=['up',e.code,performance.now()]; });
}
addEventListener('blur', ()=>{ for(const k in keys) keys[k]=false; });

// camera: drag or pointer-lock mouse-look, plus arrow keys as first-class alternative
let dragging=false;
renderer.domElement.addEventListener('mousedown', ()=>{ dragging=true;
  if(!document.pointerLockElement) renderer.domElement.requestPointerLock?.(); });
addEventListener('mouseup', ()=>dragging=false);
addEventListener('mousemove', e=>{
  if(document.pointerLockElement===renderer.domElement || dragging){
    P.yaw -= e.movementX*0.0025; P.pitch = Math.max(-1.2,Math.min(1.3,P.pitch - e.movementY*0.0025)); }});

// occluders for the camera: solid boxes with their heights (from the same records)
const occluders = L.boxes.filter(b => b.collide && b.kind !== 'bounds')
  .map(b => ({x1:b.x1, z1:b.z1, x2:b.x2, z2:b.z2, y0:b.y0, y1:b.y1}));
// segment vs AABB slab test -> nearest hit t in (0,1), or 1 if clear
function occludeT(ox,oy,oz, dx,dy,dz){
  let best = 1;
  for (const b of occluders){
    let t0=0, t1=1;
    for (const [o,d,lo,hi] of [[ox,dx,b.x1,b.x2],[oy,dy,b.y0,b.y1],[oz,dz,b.z1,b.z2]]){
      if (Math.abs(d) < 1e-9){ if (o < lo || o > hi){ t0=2; break; } continue; }
      let a=(lo-o)/d, c=(hi-o)/d; if(a>c){const s=a;a=c;c=s;}
      if(a>t0)t0=a; if(c<t1)t1=c;
      if(t0>t1) break;
    }
    if (t0 <= t1 && t0 > 0.02 && t0 < best) best = t0;
  }
  return best;
}

// ---------- procedural audio: footsteps on cobbles (WebAudio, no asset files) ----------
let AC=null, stepTimer=0, stepCount=0, ambience=null;
function ensureAudio(){ try{ AC ??= new AudioContext(); if(AC.state==='suspended') AC.resume();
  startAmbience(); }catch(e){} }
// stage 4 ambience bed — procedural, no asset files: low city rumble + wind band,
// slow independent swells so it never reads as a loop
function startAmbience(){
  if(ambience || !AC) return;
  const master=AC.createGain(); master.gain.value=0.05; master.connect(AC.destination);
  const noise=AC.createBufferSource();
  const buf=AC.createBuffer(1, AC.sampleRate*4, AC.sampleRate), d=buf.getChannelData(0);
  let last=0;                                              // brown-ish noise
  for(let i=0;i<d.length;i++){ last=(last+(Math.random()*2-1)*0.02)*0.995; d[i]=last*8; }
  noise.buffer=buf; noise.loop=true;
  const rumble=AC.createBiquadFilter(); rumble.type='lowpass'; rumble.frequency.value=180;
  const wind=AC.createBiquadFilter(); wind.type='bandpass'; wind.frequency.value=650; wind.Q.value=0.6;
  const gR=AC.createGain(), gW=AC.createGain(); gR.gain.value=0.8; gW.gain.value=0.10;
  noise.connect(rumble); rumble.connect(gR); gR.connect(master);
  noise.connect(wind); wind.connect(gW); gW.connect(master);
  const lfo=AC.createOscillator(), lg=AC.createGain();      // slow wind swell
  lfo.frequency.value=0.07; lg.gain.value=0.06;
  lfo.connect(lg); lg.connect(gW.gain); lfo.start();
  noise.start();
  ambience={master};
}
addEventListener('keydown', ensureAudio); addEventListener('mousedown', ensureAudio);
function footstep(sprint){
  stepCount++;
  if(!AC || AC.state!=='running') return;
  const t=AC.currentTime;
  const buf=AC.createBuffer(1,2205,44100), d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  const src=AC.createBufferSource(); src.buffer=buf;
  const f=AC.createBiquadFilter(); f.type='lowpass';
  f.frequency.value=(sprint?900:700)+Math.random()*180;      // stone click, slight variance
  const g=AC.createGain(); g.gain.setValueAtTime(sprint?0.22:0.15,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.09);
  src.connect(f); f.connect(g); g.connect(AC.destination); src.start(t);
}

// ---------- collision: circle vs AABB, 2 resolve passes ----------
function collide(px,pz){
  for (let pass=0; pass<2; pass++) for (const c of colliders){
    const nx=Math.max(c.x1,Math.min(px,c.x2)), nz=Math.max(c.z1,Math.min(pz,c.z2));
    const dx=px-nx, dz=pz-nz, d2=dx*dx+dz*dz;
    if (d2 < P.r*P.r){
      const d=Math.sqrt(d2)||1e-6, push=(P.r-d);
      if (d>1e-5){ px+=dx/d*push; pz+=dz/d*push; }
      else { px += (px<(c.x1+c.x2)/2? -(P.r): P.r); }     // center-inside fallback
    }
  }
  return [px,pz];
}

// ---------- route checkpoints (the core loop) ----------
const route = L.route;
let cp=0, tStart=null, tDone=null;
const beacon=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.2,30,12,1,true),
  new THREE.MeshBasicMaterial({color:0x2dd4bf,transparent:true,opacity:0.28,side:THREE.DoubleSide}));
scene.add(beacon);

// ---------- mission: The Costermonger's Round (unlocks after the route tour) ----------
const M_POINTS = [
  {x:234, z:150, prompt:'E — collect the basket',       hud:'collect the basket at the market'},
  {x:171, z:154, prompt:'E — deliver to the rookery',   hud:'deliver to the rookery (1/3)'},
  {x:67,  z:188, prompt:'E — deliver to the gin palace',hud:'deliver to the gin palace (2/3)'},
  {x:41,  z:207, prompt:'E — deliver to the church',    hud:'deliver to the church (3/3)'},
  {x:234, z:150, prompt:'E — finish the round',         hud:'return to the market'},
];
const mission = { idx:0, active:false, t0:null, tEnd:null };
const mBeacon = new THREE.Mesh(new THREE.CylinderGeometry(1.0,1.0,26,12,1,true),
  new THREE.MeshBasicMaterial({color:0xfbbf24,transparent:true,opacity:0.3,side:THREE.DoubleSide}));
mBeacon.visible=false; scene.add(mBeacon);
const basket = new THREE.Group();
{ const b=new THREE.Mesh(new THREE.BoxGeometry(.42,.22,.3), mat(0x8a6b3d));
  b.position.y=.11; basket.add(b);
  const h=new THREE.Mesh(new THREE.TorusGeometry(.14,.02,6,12,Math.PI), mat(0x6b4f2a));
  h.position.y=.24; basket.add(h); }
basket.position.set(0.35,0.75,0.12); basket.visible=false; player.add(basket);
function ding(){
  if(!AC || AC.state!=='running') return;
  const t=AC.currentTime;
  for(const [f,g0] of [[880,.12],[1320,.06]]){
    const o=AC.createOscillator(), g=AC.createGain();
    o.frequency.value=f; g.gain.setValueAtTime(g0,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.5);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+0.5);
  }
}
const promptEl=document.getElementById('prompt');
let ePrev=false;
function missionTick(){
  if(!mission.active && tDone!==null && mission.idx===0){ mission.active=true;
    setTimeout(()=>{ if(!mission.tEnd) document.getElementById('done').style.display='none'; }, 3500); }
  if(!mission.active || mission.idx>=M_POINTS.length){ mBeacon.visible=false; promptEl.style.display='none'; return; }
  const p=M_POINTS[mission.idx];
  mBeacon.visible=true; mBeacon.position.set(p.x,13,p.z);
  const near=Math.hypot(player.position.x-p.x,player.position.z-p.z)<4;
  promptEl.style.display=near?'block':'none';
  if(near) promptEl.textContent=p.prompt;
  const e=!!keys.KeyE;
  if(near && e && !ePrev){
    if(mission.idx===0) mission.t0=performance.now();
    mission.idx++; ding();
    basket.visible = mission.idx>=1 && mission.idx<4;
    if(mission.idx===M_POINTS.length){
      mission.tEnd=performance.now(); mBeacon.visible=false;
      const d=document.getElementById('done');
      d.textContent=`ROUND COMPLETE — ${((mission.tEnd-mission.t0)/1000).toFixed(1)} s`;
      d.style.display='block';
    }
  }
  ePrev=e;
}

// ---------- HUD / telemetry ----------
const hud=document.getElementById('hud');
const frameTimes=[];
window.__game = { get route(){return route.map(r=>[r[1],r[2]])},
  get x(){return player.position.x}, get z(){return player.position.z},
  get yaw(){return P.yaw}, get pitch(){return P.pitch}, get cp(){return cp},
  get cpName(){return cp<route.length?route[cp][0]:'DONE'},
  get routeDone(){return tDone!==null}, get routeSeconds(){return tDone?(tDone-tStart)/1000:null},
  get activeCamera(){return renderer.info.render.frame>0 ? _lastCam : 'none'},
  get anim(){return char.model ? char.active : 'no-character'},
  get world(){return worldReport}, get steps(){return stepCount},
  get ambience(){return !!ambience},
  get npcs(){return npcs.map(n=>({x:n.grp.position.x, z:n.grp.position.z, state:n.state}))},
  get mission(){return {idx:mission.idx, total:M_POINTS.length, active:mission.active,
    done:mission.tEnd!==null, seconds:mission.tEnd?(mission.tEnd-mission.t0)/1000:null,
    target:mission.idx<M_POINTS.length?[M_POINTS[mission.idx].x,M_POINTS[mission.idx].z]:null}},
  get rig(){ if(!char.model) return null;
    const p = char.footBone ? char.footBone.getWorldPosition(new THREE.Vector3()) : null;
    return { bones:char.bones, footBone:char.footBone?.name ?? null,
             foot: p ? [p.x,p.y,p.z] : null }; },
  get fps(){ const s=[...frameTimes].sort((a,b)=>a-b); if(!s.length) return null;
    return { median:1000/s[(s.length/2)|0], p95low:1000/s[(s.length*0.95)|0], frames:s.length }; } };
let _lastCam='none';

// ---------- main loop (rAF; tab must be visible during gate runs) ----------
let last=performance.now();
function tick(now){
  requestAnimationFrame(tick);
  const dt=Math.min((now-last)/1000, 0.05); last=now;
  frameTimes.push(now- (tick._p||now)); tick._p=now; if(frameTimes.length>600) frameTimes.shift();

  // arrow-key camera (automation-drivable)
  if(keys.ArrowLeft)  P.yaw+=1.8*dt;
  if(keys.ArrowRight) P.yaw-=1.8*dt;
  if(keys.ArrowUp)    P.pitch=Math.min(1.3,P.pitch+1.2*dt);
  if(keys.ArrowDown)  P.pitch=Math.max(-1.2,P.pitch-1.2*dt);

  // movement relative to camera yaw
  let mx=0,mz=0;
  if(keys.KeyW){mx-=Math.sin(P.yaw);mz-=Math.cos(P.yaw)}
  if(keys.KeyS){mx+=Math.sin(P.yaw);mz+=Math.cos(P.yaw)}
  if(keys.KeyA){mx-=Math.cos(P.yaw);mz+=Math.sin(P.yaw)}
  if(keys.KeyD){mx+=Math.cos(P.yaw);mz-=Math.sin(P.yaw)}
  const len=Math.hypot(mx,mz);
  const sprinting = keys.ShiftLeft||keys.ShiftRight;
  if(len>0){
    const sp=sprinting?P.sprint:P.walk;
    let nx=player.position.x+mx/len*sp*dt, nz=player.position.z+mz/len*sp*dt;
    [nx,nz]=collide(nx,nz);
    player.position.x=Math.max(0.4,Math.min(L.bounds.x-0.4,nx));
    player.position.z=Math.max(0.4,Math.min(L.bounds.z-0.4,nz));
    // smooth-turn the visual toward the movement direction
    const target=Math.atan2(mx,mz);
    let dh=target-char.heading;
    while(dh>Math.PI)dh-=2*Math.PI; while(dh<-Math.PI)dh+=2*Math.PI;
    char.heading += dh*Math.min(1, 12*dt);
    if(tStart===null) tStart=performance.now();
  }
  capsule.rotation.y=char.heading;
  if(char.model) char.model.rotation.y=char.heading;
  setAnim(len>0 ? (sprinting?'run':'walk') : 'idle');
  if(char.mixer) char.mixer.update(dt);
  if(len>0){ stepTimer-=dt; if(stepTimer<=0){ footstep(sprinting); stepTimer=sprinting?0.32:0.5; } }
  else stepTimer=0.12;

  missionTick();
  npcTick(dt);

  // checkpoints
  if(cp<route.length){
    const [,cx,cz]=route[cp];
    beacon.position.set(cx,15,cz);
    if(Math.hypot(player.position.x-cx,player.position.z-cz)<5){
      cp++;
      if(cp===route.length){ tDone=performance.now(); beacon.visible=false;
        const d=document.getElementById('done');
        d.textContent=`ROUTE COMPLETE — ${((tDone-tStart)/1000).toFixed(1)} s`; d.style.display='block'; }
    }
  }

  // third-person camera, pulled in when a wall occludes the player
  const ty=1.6, tx=player.position.x, tz=player.position.z;
  const cd=5.0;
  const ox=Math.sin(P.yaw)*Math.cos(P.pitch)*cd,
        oy=Math.max(0.4, ty-Math.sin(P.pitch)*cd)-ty,
        oz=Math.cos(P.yaw)*Math.cos(P.pitch)*cd;
  const t = occludeT(tx,ty,tz, ox,oy,oz);
  // stop just in front of the wall; the wall margin must beat the comfort floor,
  // or a player backed against a wall puts the camera THROUGH it (seen in-game)
  const k = Math.max(0.03, Math.min(t*0.95, t-0.02));
  gameplayCamera.position.set(tx+ox*k, ty+oy*k, tz+oz*k);
  gameplayCamera.lookAt(tx,ty,tz);
  const cam = (FAULT==='cam') ? debugCamera : gameplayCamera;   // 'cam' fault: stolen view
  _lastCam = cam.name;
  renderer.render(scene, cam);

  const f=__game.fps;
  hud.textContent =
    (mission.active && mission.idx<M_POINTS.length
      ? `The Costermonger's Round: ${M_POINTS[mission.idx].hud}`
      : `Checkpoint ${Math.min(cp+1,route.length)}/${route.length}: ${__game.cpName}`)+
    `\npos ${player.position.x.toFixed(1)}, ${player.position.z.toFixed(1)}`+
    (f?`\nfps ~${f.median.toFixed(0)}`:'');
}
requestAnimationFrame(tick);
</script>
</body>
</html>
